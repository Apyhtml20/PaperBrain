services:

  backend:
    build:
      context: ./backend        # Docker lit les fichiers DEPUIS ./backend
      dockerfile: Dockerfile
    container_name: smartstudy-backend
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_MODEL: ${HF_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-true}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.12}
      SEMANTIC_CACHE_TTL: ${SEMANTIC_CACHE_TTL:-86400}
    volumes:
      - chroma_data:/app/chroma_db
      - documents_data:/app/documents
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend       # Docker lit les fichiers DEPUIS ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: smartstudy-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Cache — Valkey (fork Redis, Linux Foundation) ────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: smartstudy-valkey
    ports:
      - "6379:6379"
    command: valkey-server --save 60 1 --appendonly yes
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Observabilité — BetterDB surveille Valkey (slowlog, hot keys, mémoire)
  #    et le cache sémantique (hit-rate, coût économisé, recommandations de
  #    seuil) via son auto-discovery dans Valkey. UI: http://localhost:3001
  betterdb-monitor:
    image: betterdb/monitor:latest
    container_name: smartstudy-betterdb
    ports:
      - "3001:3001"
    environment:
      DB_HOST: valkey
      DB_PORT: 6379
      STORAGE_TYPE: sqlite
      ENCRYPTION_KEY: ${BETTERDB_ENCRYPTION_KEY:-paperbrain-dev-key-change-me}
    volumes:
      - betterdb_data:/app/data
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  documents_data:
  valkey_data:
  betterdb_data:
